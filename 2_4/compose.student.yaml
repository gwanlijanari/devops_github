name: compose-lab

services:
  web:
    image: devops-student:v1
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      ROLE: web
      API_URL: "http://api:8000"
      PORT: "8000"
      APP_NAME: "${APP_NAME}"
    depends_on:
      - api

  api:
    image: devops-student:v1
    environment:
      ROLE: api
      PORT: "8000"
      APP_NAME: "${APP_NAME}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data: